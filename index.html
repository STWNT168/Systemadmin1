<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Hub · Calls · Repairs · Letters · Remote</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0e14;
            color: #e8edf5;
            display: flex;
            min-height: 100vh;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f2a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2f3a4b;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a5a72;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 210px;
            background: #111820;
            border-right: 1px solid #1f2937;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 20px;
        }
        .sidebar-brand i {
            font-size: 24px;
            color: #5b9cf5;
            background: #1a2a44;
            padding: 10px;
            border-radius: 12px;
        }
        .sidebar-brand span {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .sidebar-brand small {
            display: block;
            font-weight: 400;
            font-size: 10px;
            color: #7a8aa0;
            letter-spacing: 0.3px;
        }

        .sidebar-nav {
            flex: 1;
        }
        .sidebar-nav .nav-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #4d5f77;
            padding: 14px 8px 6px;
            font-weight: 600;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #b0c0d4;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            margin-bottom: 2px;
            cursor: pointer;
        }
        .sidebar-nav a i {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }
        .sidebar-nav a:hover {
            background: #1d293a;
            color: #e8edf5;
        }
        .sidebar-nav a.active {
            background: #1a2a44;
            color: #5b9cf5;
            box-shadow: inset 3px 0 0 #5b9cf5;
        }
        .sidebar-nav a .badge {
            margin-left: auto;
            background: #2a3a55;
            color: #b0c8f0;
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .sidebar-nav a .badge.danger {
            background: #4a1e2a;
            color: #f58b9c;
        }
        .sidebar-nav a .badge.success {
            background: #1a3a2a;
            color: #5fbfa0;
        }

        .sidebar-footer {
            border-top: 1px solid #1f2937;
            padding-top: 14px;
            margin-top: 6px;
        }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #7a8aa0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.15s;
            cursor: pointer;
        }
        .sidebar-footer a:hover {
            background: #1d293a;
            color: #e8edf5;
        }

        /* ── Main ── */
        .main {
            flex: 1;
            padding: 20px 28px 32px;
            overflow-y: auto;
            min-width: 0;
        }

        /* ── Top bar ── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .topbar h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar h1 i {
            color: #5b9cf5;
            font-size: 20px;
        }
        .topbar h1 small {
            font-weight: 400;
            font-size: 13px;
            color: #7a8aa0;
            margin-left: 6px;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar-actions .btn {
            background: #1d293a;
            border: none;
            color: #e8edf5;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar-actions .btn:hover {
            background: #2a3a55;
        }
        .topbar-actions .btn-primary {
            background: #1a3a6a;
            color: #7ab7ff;
        }
        .topbar-actions .btn-primary:hover {
            background: #1f4a8a;
        }

        /* ── Tab Content ── */
        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Cards / Panels ── */
        .panel {
            background: #141c28;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 18px 20px 20px;
            margin-bottom: 20px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .panel-header h3 {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-header .action {
            color: #7a8aa0;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel-header .action:hover {
            color: #e8edf5;
        }
        .panel-header .pill {
            background: #1d293a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            color: #b0c0d4;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .grid-3col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 900px) {
            .grid-2col,
            .grid-3col {
                grid-template-columns: 1fr;
            }
        }

        /* ── Calls ── */
        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #0f1720;
            margin-bottom: 6px;
            transition: 0.1s;
            cursor: pointer;
        }
        .contact-item:hover {
            background: #1a2330;
        }
        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1a2a44;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #5b9cf5;
            flex-shrink: 0;
        }
        .contact-avatar.offline {
            background: #1a1a2a;
            color: #4d5f77;
        }
        .contact-info {
            flex: 1;
        }
        .contact-info .phone {
            font-size: 14px;
            font-weight: 500;
        }
        .contact-info .status-badge {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            background: #1a3a2a;
            color: #5fbfa0;
            display: inline-block;
        }
        .contact-info .status-badge.offline {
            background: #2a1a1a;
            color: #e08a8a;
        }
        .contact-actions {
            display: flex;
            gap: 8px;
        }
        .contact-actions button {
            background: #1d293a;
            border: none;
            color: #b0c0d4;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.15s;
            font-size: 13px;
        }
        .contact-actions button:hover {
            background: #2a3a55;
            color: #e8edf5;
        }
        .contact-actions button.call-btn {
            background: #1a3a3a;
            color: #5fbfa0;
        }
        .contact-actions button.call-btn:hover {
            background: #1a5a4a;
        }

        .dialer {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
        }
        .dialer-display {
            background: #0b0e14;
            border-radius: 10px;
            padding: 12px 18px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #e8edf5;
            border: 1px solid #1f2937;
            margin-bottom: 16px;
            min-height: 58px;
            font-family: 'JetBrains Mono', monospace;
        }
        .dialer-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
        }
        .dialer-grid button {
            background: #1d293a;
            border: none;
            color: #e8edf5;
            padding: 14px 0;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.12s;
        }
        .dialer-grid button:hover {
            background: #2a3a55;
        }
        .dialer-grid button:active {
            transform: scale(0.94);
        }
        .dialer-grid button .sub {
            display: block;
            font-size: 9px;
            font-weight: 400;
            color: #4d5f77;
        }
        .dialer-actions {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }
        .dialer-actions button {
            border: none;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dialer-actions .call-action {
            background: #2ecc71;
            color: #0b0e14;
        }
        .dialer-actions .call-action:hover {
            background: #3ddc84;
        }
        .dialer-actions .end-action {
            background: #e74c6f;
            color: #fff;
        }
        .dialer-actions .end-action:hover {
            background: #ff5a7a;
        }
        .dialer-actions .clear-action {
            background: #1d293a;
            color: #b0c0d4;
        }
        .dialer-actions .clear-action:hover {
            background: #2a3a55;
        }

        .call-log-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #0f1720;
            font-size: 13px;
        }
        .call-log-item:last-child {
            border-bottom: none;
        }
        .call-log-item .icon {
            width: 28px;
            text-align: center;
            color: #4d5f77;
        }
        .call-log-item .icon.incoming {
            color: #5b9cf5;
        }
        .call-log-item .icon.outgoing {
            color: #2ecc71;
        }
        .call-log-item .icon.missed {
            color: #e74c6f;
        }
        .call-log-item .details {
            flex: 1;
        }
        .call-log-item .details .name {
            font-weight: 500;
        }
        .call-log-item .details .time {
            font-size: 11px;
            color: #7a8aa0;
        }
        .call-log-item .duration {
            color: #4d5f77;
            font-size: 12px;
        }

        /* ── Repairs ── */
        .repair-card {
            background: #0f1720;
            border-radius: 10px;
            padding: 14px 16px;
            border-left: 3px solid #5b9cf5;
            margin-bottom: 10px;
            transition: 0.1s;
        }
        .repair-card:hover {
            background: #1a2330;
        }
        .repair-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .repair-card .title {
            font-weight: 600;
            font-size: 14px;
        }
        .repair-card .id {
            font-size: 11px;
            color: #4d5f77;
        }
        .repair-card .desc {
            font-size: 13px;
            color: #b0c0d4;
            margin: 4px 0 6px;
        }
        .repair-card .meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #7a8aa0;
            flex-wrap: wrap;
        }
        .repair-card .meta .priority {
            font-weight: 600;
        }
        .repair-card .meta .priority.high {
            color: #e74c6f;
        }
        .repair-card .meta .priority.medium {
            color: #f1c40f;
        }
        .repair-card .meta .priority.low {
            color: #5fbfa0;
        }
        .repair-card .meta .time-taken {
            color: #5b9cf5;
        }
        .repair-status {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .repair-status.pending {
            background: #2a2a1a;
            color: #f1c40f;
        }
        .repair-status.in-progress {
            background: #1a2a44;
            color: #5b9cf5;
        }
        .repair-status.completed {
            background: #1a3a2a;
            color: #2ecc71;
        }

        .repair-form input,
        .repair-form select,
        .repair-form textarea {
            width: 100%;
            padding: 10px 14px;
            background: #0b0e14;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: #e8edf5;
            font-size: 13px;
            transition: 0.15s;
            margin-bottom: 10px;
        }
        .repair-form input:focus,
        .repair-form select:focus,
        .repair-form textarea:focus {
            outline: none;
            border-color: #5b9cf5;
            box-shadow: 0 0 0 3px rgba(91, 156, 245, 0.15);
        }
        .repair-form textarea {
            resize: vertical;
            min-height: 60px;
        }
        .repair-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .repair-form .btn-submit {
            background: #1a3a6a;
            border: none;
            color: #7ab7ff;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
        }
        .repair-form .btn-submit:hover {
            background: #1f4a8a;
        }

        /* ── Letter Drafting ── */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 10px;
            background: #0b0e14;
            border-radius: 10px 10px 0 0;
            border: 1px solid #1f2937;
            border-bottom: none;
        }
        .editor-toolbar button {
            background: transparent;
            border: none;
            color: #b0c0d4;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.12s;
        }
        .editor-toolbar button:hover {
            background: #1d293a;
            color: #e8edf5;
        }
        .editor-toolbar button.active {
            background: #1a2a44;
            color: #5b9cf5;
        }
        .editor-toolbar .sep {
            width: 1px;
            background: #1f2937;
            margin: 0 4px;
        }
        .editor-content {
            background: #0b0e14;
            border: 1px solid #1f2937;
            border-radius: 0 0 10px 10px;
            padding: 20px 24px;
            min-height: 260px;
            color: #e8edf5;
            font-size: 14px;
            line-height: 1.7;
            outline: none;
            overflow-y: auto;
        }
        .editor-content:focus {
            border-color: #2f3a4b;
        }
        .editor-content h1,
        .editor-content h2,
        .editor-content h3 {
            margin: 8px 0;
        }
        .editor-content ul,
        .editor-content ol {
            padding-left: 24px;
        }
        .editor-content blockquote {
            border-left: 3px solid #5b9cf5;
            padding-left: 16px;
            color: #b0c0d4;
            margin: 8px 0;
        }
        .letter-templates {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .letter-templates button {
            background: #1d293a;
            border: none;
            color: #b0c0d4;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.12s;
        }
        .letter-templates button:hover {
            background: #2a3a55;
            color: #e8edf5;
        }

        /* ── Remote Systems ── */
        .remote-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: #0f1720;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: 0.1s;
            border-left: 3px solid #2ecc71;
        }
        .remote-item.offline {
            border-left-color: #4d5f77;
        }
        .remote-item:hover {
            background: #1a2330;
        }
        .remote-item .info {
            flex: 1;
        }
        .remote-item .info .addr {
            font-size: 14px;
            font-weight: 500;
        }
        .remote-item .info .os {
            font-size: 12px;
            color: #7a8aa0;
            margin-left: 8px;
        }
        .remote-item .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            flex-shr

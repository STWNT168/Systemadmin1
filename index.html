<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSLOG — IT Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1417;
    --panel:#161C20;
    --panel-2:#1C2327;
    --border:#262E33;
    --border-light:#323C42;
    --text:#E8EDF0;
    --muted:#8B99A3;
    --dim:#5A6871;
    --cyan:#4FC3D9;
    --amber:#E8A33D;
    --green:#4CAF7D;
    --red:#E1584B;
    --violet:#9C8CF0;
    --mono:'IBM Plex Mono',monospace;
    --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(79,195,217,0.05), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(232,163,61,0.04), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--cyan);color:#06181c;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(15,20,23,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.4s infinite;}
  .brand h1{font-family:var(--mono);font-size:17px;letter-spacing:1.5px;margin:0;font-weight:600;}
  .brand span{color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:1px;}
  .header-right{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:12px;color:var(--muted);}
  #clock{color:var(--cyan);font-weight:600;letter-spacing:0.5px;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  main{max-width:980px;margin:0 auto;padding:22px 20px 80px;}

  /* ---------- Stat strip ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  .stat{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--cyan));}
  .stat .label{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;}
  .stat .value{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:4px;}
  @media (max-width:680px){.stats{grid-template-columns:repeat(2,1fr);}}

  /* ---------- Panel ---------- */
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden;}
  .panel-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .panel-head h2{font-family:var(--mono);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600;}
  .panel-body{padding:18px;}

  /* ---------- Category tabs ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 18px 0;}
  .tab{
    font-family:var(--mono);font-size:12px;letter-spacing:0.4px;
    padding:8px 13px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--muted);cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:all .15s ease;
  }
  .tab:hover{border-color:var(--border-light);color:var(--text);}
  .tab.active{color:#0b1214;border-color:transparent;}
  .tab .sw{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .tab[data-cat="call"].active{background:var(--cyan);}
  .tab[data-cat="repair"].active{background:var(--amber);}
  .tab[data-cat="rdp"].active{background:var(--violet);}
  .tab[data-cat="task"].active{background:var(--green);}
  .tab[data-cat="general"].active{background:var(--muted);}

  /* ---------- Form ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-family:var(--mono);font-size:10.5px;letter-spacing:0.8px;text-transform:uppercase;color:var(--dim);}
  input,select,textarea{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-family:var(--sans);font-size:13.5px;padding:9px 11px;border-radius:7px;
    outline:none;transition:border-color .15s ease;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--cyan);}
  textarea{resize:vertical;min-height:56px;}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238B99A3'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:28px;}

  /* ---------- Range slider ---------- */
  .slider-row{display:flex;align-items:center;gap:12px;}
  input[type="range"]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:4px;border-radius:2px;
    background:linear-gradient(to right, var(--cyan) 0%, var(--cyan) var(--fill,0%), var(--border-light) var(--fill,0%), var(--border-light) 100%);
    padding:0;border:none;outline:none;cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--cyan);border:2px solid #06181c;
    box-shadow:0 0 0 2px var(--cyan);cursor:pointer;
    transition:transform .12s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15);}
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:var(--cyan);border:2px solid #06181c;
    box-shadow:0 0 0 2px var(--cyan);cursor:pointer;
  }
  input[type="range"]::-moz-range-track{background:var(--border-light);height:4px;border-radius:2px;}
  .slider-value{
    font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--cyan);
    min-width:52px;text-align:right;flex:none;
  }

  .call-row{display:flex;gap:8px;align-items:flex-end;}
  .call-row .field{flex:1;}
  .btn{
    font-family:var(--mono);font-size:12px;letter-spacing:0.5px;font-weight:600;
    padding:9px 15px;border-radius:7px;border:1px solid var(--border-light);
    background:var(--panel-2);color:var(--text);cursor:pointer;transition:all .15s ease;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn-primary{background:var(--cyan);color:#06181c;border-color:var(--cyan);}
  .btn-primary:hover{filter:brightness(1.1);color:#06181c;}
  .btn-dial{background:var(--green);color:#062015;border-color:var(--green);}
  .btn-dial:hover{filter:brightness(1.1);color:#062015;}
  .btn-danger:hover{border-color:var(--red);color:var(--red);}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:5px 9px;font-size:10.5px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  .form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap;}
  .timer-box{font-family:var(--mono);font-size:13px;color:var(--amber);display:flex;align-items:center;gap:8px;}
  .timer-box .led{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;}

  /* ---------- Filters ---------- */
  .filters{display:flex;gap:8px;padding:14px 18px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
  .filters select,.filters input{width:auto;min-width:110px;flex:1;}
  .filters input[type="text"]{flex:2;min-width:150px;}

  /* ---------- Entry list ---------- */
  .entry-list{display:flex;flex-direction:column;}
  .entry{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;}
  .entry:last-child{border-bottom:none;}
  .entry:hover{background:rgba(255,255,255,0.015);}
  .entry .led-col{padding-top:5px;}
  .led{width:8px;height:8px;border-radius:50%;flex:none;}
  .led.open{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse 1.6s infinite;}
  .led.progress{background:var(--amber);box-shadow:0 0 6px var(--amber);animation:pulse 1.6s infinite;}
  .led.done{background:var(--green);}
  .entry-main{flex:1;min-width:0;}
  .entry-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px;}
  .ticket-id{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--cyan);}
  .entry[data-cat="repair"] .ticket-id{color:var(--amber);}
  .entry[data-cat="rdp"] .ticket-id{color:var(--violet);}
  .entry[data-cat="task"] .ticket-id{color:var(--green);}
  .entry[data-cat="general"] .ticket-id{color:var(--muted);}
  .status-badge{font-family:var(--mono);font-size:9.5px;letter-spacing:0.6px;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--border-light);color:var(--muted);}
  .entry-time{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto;}
  .entry-title{font-size:14px;font-weight:600;margin-bottom:2px;}
  .entry-meta{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .entry-meta b{color:var(--text);font-weight:600;}
  .entry-notes{font-size:12.5px;color:var(--muted);margin-top:4px;font-style:italic;}
  .entry-actions{display:flex;gap:6px;margin-top:8px;}
  .empty{padding:40px 20px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12.5px;}

  footer{text-align:center;padding:20px;color:var(--dim);font-family:var(--mono);font-size:11px;}
  footer a{color:var(--muted);}

  @media (max-width:600px){
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <h1>OPSLOG</h1>
    <span>IT SUPPORT ACTIVITY CONSOLE</span>
  </div>
  <div class="header-right">
    <span id="clock">--:--:--</span>
  </div>
</header>

<main>

  <div class="stats">
    <div class="stat" style="--accent:var(--cyan)">
      <div class="label">Calls Today</div>
      <div class="value" id="statCalls">0</div>
    </div>
    <div class="stat" style="--accent:var(--red)">
      <div class="label">Open Tickets</div>
      <div class="value" id="statOpen">0</div>
    </div>
    <div class="stat" style="--accent:var(--green)">
      <div class="label">Resolved Today</div>
      <div class="value" id="statResolved">0</div>
    </div>
    <div class="stat" style="--accent:var(--amber)">
      <div class="label">Hours Logged</div>
      <div class="value" id="statHours">0.0</div>
    </div>
  </div>

  <!-- NEW ENTRY -->
  <div class="panel">
    <div class="panel-head"><h2>New Log Entry</h2></div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-cat="call"><span class="sw"></span>Office Call</div>
      <div class="tab" data-cat="repair"><span class="sw"></span>System Repair</div>
      <div class="tab" data-cat="rdp"><span class="sw"></span>Remote Desktop</div>
      <div class="tab" data-cat="task"><span class="sw"></span>Productivity / Task</div>
      <div class="tab" data-cat="general"><span class="sw"></span>General Activity</div>
    </div>
    <div class="panel-body">
      <form id="entryForm">
        <div class="form-grid" id="metaFields" style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--border);">
          <div class="field">
            <label for="entryDate">Entry Date *</label>
            <input type="date" id="entryDate" name="entryDate" required>
          </div>
          <div class="field">
            <label for="entryTimeInput">Entry Time</label>
            <input type="time" id="entryTimeInput" name="entryTimeInput">
          </div>
        </div>
        <div class="form-grid" id="formFields"></div>
        <div class="form-actions">
          <div class="timer-box" id="timerBox" style="display:none;">
            <span class="led"></span><span id="timerText">00:00</span>
          </div>
          <div style="display:flex;gap:8px;">
            <button type="button" class="btn btn-dial" id="dialBtn" style="display:none;">📞 Dial &amp; Start Timer</button>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Entry</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- LOG -->
  <div class="panel">
    <div class="panel-head">
      <h2>Activity Log</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm" id="exportJson">⤓ Export JSON</button>
        <button class="btn btn-sm" id="exportCsv">⤓ Export CSV</button>
      </div>
    </div>
    <div class="filters">
      <select id="filterCat">
        <option value="all">All categories</option>
        <option value="call">Office Call</option>
        <option value="repair">System Repair</option>
        <option value="rdp">Remote Desktop</option>
        <option value="task">Productivity / Task</option>
        <option value="general">General</option>
      </select>
      <select id="filterStatus">
        <option value="all">All statuses</option>
        <option value="open">Open</option>
        <option value="progress">In Progress</option>
        <option value="done">Done / Resolved</option>
      </select>
      <input type="text" id="filterSearch" placeholder="Search title, office, notes…">
    </div>
    <div class="entry-list" id="entryList"></div>
  </div>

  <footer>OPSLOG · data stored privately to your account · <span id="totalCount">0</span> entries logged all-time</footer>

</main>

<script>
(function(){
  const CATS = {
    call:    { prefix:'CALL', label:'Office Call', color:'cyan' },
    repair:  { prefix:'SYS',  label:'System Repair', color:'amber' },
    rdp:     { prefix:'RDP',  label:'Remote Desktop', color:'violet' },
    task:    { prefix:'TASK', label:'Productivity / Task', color:'green' },
    general: { prefix:'GEN',  label:'General Activity', color:'muted' }
  };

  const FIELD_DEFS = {
    call: [
      {key:'office', label:'Office / Client Name', type:'text', required:true, full:true},
      {key:'contact', label:'Contact Person', type:'text'},
      {key:'phone', label:'Phone Number', type:'tel'},
      {key:'purpose', label:'Purpose of Call', type:'text', full:true},
      {key:'duration', label:'Duration', type:'range', min:0, max:60, step:1, unit:'min'},
      {key:'status', label:'Status', type:'select', options:['done:Completed','progress:Follow-up Needed','open:Missed / Callback']},
      {key:'notes', label:'Notes / Outcome', type:'textarea', full:true}
    ],
    repair: [
      {key:'system', label:'System / Device', type:'text', required:true, full:true},
      {key:'location', label:'Location / Office', type:'text'},
      {key:'priority', label:'Priority', type:'select', options:['open:High','progress:Medium','done:Low']},
      {key:'issue', label:'Issue Description', type:'textarea', full:true},
      {key:'actions', label:'Actions Taken', type:'textarea', full:true},
      {key:'duration', label:'Time Spent', type:'range', min:0, max:240, step:5, unit:'min'},
      {key:'status', label:'Status', type:'select', options:['open:Open','progress:In Progress','done:Resolved']}
    ],
    rdp: [
      {key:'user', label:'User / Client', type:'text', required:true, full:true},
      {key:'tool', label:'Remote Tool Used', type:'select', options:['AnyDesk','TeamViewer','Chrome Remote Desktop','RDP / Windows Remote','Other']},
      {key:'issue', label:'Issue', type:'textarea', full:true},
      {key:'resolution', label:'Resolution', type:'textarea', full:true},
      {key:'duration', label:'Session Duration', type:'range', min:0, max:120, step:5, unit:'min'},
      {key:'status', label:'Status', type:'select', options:['open:Open','progress:In Progress','done:Resolved']}
    ],
    task: [
      {key:'task', label:'Task Name', type:'text', required:true, full:true},
      {key:'category', label:'Category', type:'select', options:['Admin','Maintenance','Documentation','Meeting','Training','Other']},
      {key:'duration', label:'Time Spent', type:'range', min:0, max:240, step:5, unit:'min'},
      {key:'status', label:'Status', type:'select', options:['open:To Do','progress:In Progress','done:Done']},
      {key:'notes', label:'Notes', type:'textarea', full:true}
    ],
    general: [
      {key:'title', label:'Activity', type:'text', required:true, full:true},
      {key:'duration', label:'Duration', type:'range', min:0, max:180, step:5, unit:'min'},
      {key:'status', label:'Status', type:'select', options:['open:Open','progress:In Progress','done:Done']},
      {key:'notes', label:'Notes', type:'textarea', full:true}
    ]
  };

  let activeCat = 'call';
  let entries = [];
  let counters = {call:0, repair:0, rdp:0, task:0, general:0};
  let timerInterval = null, timerStart = null;

  const $ = (id) => document.getElementById(id);
  const formFields = $('formFields');
  const tabsEl = $('tabs');
  const entryList = $('entryList');
  const dialBtn = $('dialBtn');
  const timerBox = $('timerBox');
  const timerText = $('timerText');
  const entryDateInput = $('entryDate');
  const entryTimeInput = $('entryTimeInput');

  function pad(n){ return String(n).padStart(2,'0'); }
  function setMetaFieldsToNow(){
    const now = new Date();
    entryDateInput.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    entryDateInput.max = entryDateInput.value; // no future-dating
    entryTimeInput.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }
  setMetaFieldsToNow();

  // ---------- storage ----------
  async function loadData(){
    try{
      const res = await window.storage.get('opslog-data', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        entries = parsed.entries || [];
        counters = parsed.counters || counters;
      }
    }catch(e){ /* no data yet */ }
    render();
  }
  async function saveData(){
    try{
      await window.storage.set('opslog-data', JSON.stringify({entries, counters}), false);
    }catch(e){ console.error('Save failed', e); }
  }

  // ---------- clock ----------
  function tickClock(){
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  setInterval(tickClock, 1000); tickClock();

  // ---------- build form ----------
  function buildForm(cat){
    formFields.innerHTML = '';
    FIELD_DEFS[cat].forEach(f => {
      const wrap = document.createElement('div');
      wrap.className = 'field' + (f.full ? ' full' : '');
      const label = document.createElement('label');
      label.textContent = f.label + (f.required ? ' *' : '');
      wrap.appendChild(label);
      let input;
      if(f.type === 'textarea'){
        input = document.createElement('textarea');
        input.name = f.key;
        if(f.required) input.required = true;
        wrap.appendChild(input);
      } else if(f.type === 'select'){
        input = document.createElement('select');
        f.options.forEach(opt => {
          const [val, text] = opt.includes(':') ? opt.split(':') : [opt, opt];
          const o = document.createElement('option');
          o.value = val; o.textContent = text;
          input.appendChild(o);
        });
        input.name = f.key;
        if(f.required) input.required = true;
        wrap.appendChild(input);
      } else if(f.type === 'range'){
        input = document.createElement('input');
        input.type = 'range';
        input.name = f.key;
        input.min = f.min; input.max = f.max; input.step = f.step;
        input.value = f.min;
        const row = document.createElement('div');
        row.className = 'slider-row';
        const valSpan = document.createElement('span');
        valSpan.className = 'slider-value';
        const unit = f.unit || '';
        const updateFill = () => {
          const pct = ((input.value - f.min) / (f.max - f.min)) * 100;
          input.style.setProperty('--fill', pct + '%');
          valSpan.textContent = input.value + (unit ? ' ' + unit : '');
        };
        input.addEventListener('input', updateFill);
        updateFill();
        row.appendChild(input);
        row.appendChild(valSpan);
        wrap.appendChild(row);
      } else {
        input = document.createElement('input');
        input.type = f.type;
        input.name = f.key;
        if(f.required) input.required = true;
        wrap.appendChild(input);
      }
      formFields.appendChild(wrap);
    });
    dialBtn.style.display = cat === 'call' ? 'inline-flex' : 'none';
    resetTimer();
  }

  tabsEl.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if(!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCat = tab.dataset.cat;
    buildForm(activeCat);
  });

  // ---------- dial / timer ----------
  dialBtn.addEventListener('click', () => {
    const phoneInput = formFields.querySelector('[name="phone"]');
    const phone = phoneInput ? phoneInput.value.trim() : '';
    if(phone){
      window.location.href = 'tel:' + phone.replace(/[^0-9+]/g,'');
    } else {
      alert('Enter a phone number to dial, or just start the timer manually.');
    }
    startTimer();
  });

  function startTimer(){
    if(timerInterval) return;
    timerStart = Date.now();
    timerBox.style.display = 'flex';
    timerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - timerStart)/1000);
      const m = String(Math.floor(secs/60)).padStart(2,'0');
      const s = String(secs%60).padStart(2,'0');
      timerText.textContent = m + ':' + s;
    }, 1000);
  }
  function stopTimerAndGetMinutes(){
    if(!timerInterval) return null;
    clearInterval(timerInterval);
    const secs = Math.floor((Date.now() - timerStart)/1000);
    timerInterval = null;
    return Math.max(1, Math.round(secs/60));
  }
  function resetTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    timerBox.style.display = 'none';
    timerText.textContent = '00:00';
  }

  // ---------- save entry ----------
  $('entryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {};
    let titleGuess = '';
    FIELD_DEFS[activeCat].forEach(f => {
      const el = formFields.querySelector(`[name="${f.key}"]`);
      data[f.key] = el ? el.value : '';
    });

    // if a live call timer was running, override duration
    if(activeCat === 'call' && timerInterval){
      const mins = stopTimerAndGetMinutes();
      if(mins) data.duration = String(mins);
    }

    titleGuess = data.office || data.system || data.user || data.task || data.title || 'Untitled';

    counters[activeCat] = (counters[activeCat]||0) + 1;
    const ticketId = CATS[activeCat].prefix + '-' + String(counters[activeCat]).padStart(4,'0');

    const pickedDate = entryDateInput.value || `${new Date().getFullYear()}-${pad(new Date().getMonth()+1)}-${pad(new Date().getDate())}`;
    const pickedTime = entryTimeInput.value || `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
    const entryTimestamp = new Date(`${pickedDate}T${pickedTime}:00`).toISOString();

    const entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      ticketId,
      category: activeCat,
      title: titleGuess,
      status: data.status || data.priority || 'open',
      timestamp: entryTimestamp,
      data
    };
    entries.unshift(entry);
    entries.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
    await saveData();
    buildForm(activeCat);
    setMetaFieldsToNow();
    render();
  });

  // ---------- render ----------
  function fmtTime(iso){
    const d = new Date(iso);
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    return (sameDay ? '' : d.toLocaleDateString([], {month:'short',day:'numeric'}) + ' ') +
           d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }

  function statusLabel(status){
    return {open:'Open', progress:'In Progress', done:'Done'}[status] || status || '—';
  }

  function metaLine(entry){
    const d = entry.data;
    const parts = [];
    if(entry.category === 'call'){
      if(d.contact) parts.push(`<b>${esc(d.contact)}</b>`);
      if(d.phone) parts.push(esc(d.phone));
      if(d.duration) parts.push(esc(d.duration)+' min');
      if(d.purpose) parts.push(esc(d.purpose));
    } else if(entry.category === 'repair'){
      if(d.location) parts.push(esc(d.location));
      if(d.priority) parts.push('Priority: '+statusLabel(d.priority));
      if(d.duration) parts.push(esc(d.duration)+' min');
    } else if(entry.category === 'rdp'){
      if(d.tool) parts.push(`<b>${esc(d.tool)}</b>`);
      if(d.duration) parts.push(esc(d.duration)+' min');
    } else if(entry.category === 'task'){
      if(d.category) parts.push(esc(d.category));
      if(d.duration) parts.push(esc(d.duration)+' min');
    } else {
      if(d.duration) parts.push(esc(d.duration)+' min');
    }
    return parts.join(' &nbsp;·&nbsp; ');
  }

  function notesLine(entry){
    const d = entry.data;
    const note = d.notes || d.issue || d.actions || d.resolution || '';
    return note ? esc(note) : '';
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    // stats
    const today = new Date().toDateString();
    const todays = entries.filter(e => new Date(e.timestamp).toDateString() === today);
    $('statCalls').textContent = todays.filter(e => e.category === 'call').length;
    $('statOpen').textContent = entries.filter(e => e.status === 'open' || e.status === 'progress').length;
    $('statResolved').textContent = todays.filter(e => e.status === 'done').length;
    const totalMins = todays.reduce((sum,e) => sum + (parseFloat(e.data.duration)||0), 0);
    $('statHours').textContent = (totalMins/60).toFixed(1);
    $('totalCount').textContent = entries.length;

    // filters
    const catF = $('filterCat').value;
    const statusF = $('filterStatus').value;
    const searchF = $('filterSearch').value.trim().toLowerCase();

    let filtered = entries.filter(e => {
      if(catF !== 'all' && e.category !== catF) return false;
      if(statusF !== 'all' && e.status !== statusF) return false;
      if(searchF){
        const hay = (e.title + ' ' + JSON.stringify(e.data)).toLowerCase();
        if(!hay.includes(searchF)) return false;
      }
      return true;
    });

    if(filtered.length === 0){
      entryList.innerHTML = '<div class="empty">No entries match. Log your first activity above.</div>';
      return;
    }

    entryList.innerHTML = filtered.map(entry => `
      <div class="entry" data-cat="${entry.category}">
        <div class="led-col"><div class="led ${entry.status === 'open' ? 'open' : entry.status === 'progress' ? 'progress' : 'done'}"></div></div>
        <div class="entry-main">
          <div class="entry-top">
            <span class="ticket-id">${entry.ticketId}</span>
            <span class="status-badge">${statusLabel(entry.status)}</span>
            <span class="entry-time">${fmtTime(entry.timestamp)}</span>
          </div>
          <div class="entry-title">${esc(entry.title)} <span style="color:var(--dim);font-weight:400;font-size:11px;">— ${CATS[entry.category].label}</span></div>
          <div class="entry-meta">${metaLine(entry)}</div>
          ${notesLine(entry) ? `<div class="entry-notes">"${notesLine(entry)}"</div>` : ''}
          <div class="entry-actions">
            <button class="btn btn-sm btn-ghost" onclick="opslogCycleStatus('${entry.id}')">Cycle Status</button>
            <button class="btn btn-sm btn-ghost btn-danger" onclick="opslogDelete('${entry.id}')">Delete</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  window.opslogCycleStatus = async function(id){
    const entry = entries.find(e => e.id === id);
    if(!entry) return;
    const order = ['open','progress','done'];
    const idx = order.indexOf(entry.status);
    entry.status = order[(idx+1) % order.length];
    if(entry.data.status !== undefined) entry.data.status = entry.status;
    await saveData();
    render();
  };
  window.opslogDelete = async function(id){
    if(!confirm('Delete this log entry? This cannot be undone.')) return;
    entries = entries.filter(e => e.id !== id);
    await saveData();
    render();
  };

  $('filterCat').addEventListener('change', render);
  $('filterStatus').addEventListener('change', render);
  $('filterSearch').addEventListener('input', render);

  // ---------- export ----------
  function download(filename, content, mime){
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  $('exportJson').addEventListener('click', () => {
    download('opslog-export.json', JSON.stringify(entries, null, 2), 'application/json');
  });
  $('exportCsv').addEventListener('click', () => {
    const rows = [['Ticket ID','Category','Title','Status','Timestamp','Duration (min)','Details']];
    entries.forEach(e => {
      const details = Object.entries(e.data).map(([k,v]) => `${k}: ${v}`).join(' | ');
      rows.push([e.ticketId, CATS[e.category].label, e.title, statusLabel(e.status), e.timestamp, e.data.duration||'', details]);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    download('opslog-export.csv', csv, 'text/csv');
  });

  // ---------- init ----------
  buildForm(activeCat);
  loadData();
})();
</script>
</body>
</html>
